name: CI
# Runs the tests and the build on every push. dist/ is not committed in Rounds (Cloudflare Pages and the Android build
# both make it with node build.mjs), so the build itself checks that every file the website serves is there.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Build (fails if a file the offline cache lists is missing from dist/)
        run: node build.mjs
