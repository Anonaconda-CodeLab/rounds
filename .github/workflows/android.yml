name: Android APK
# Builds the Android app (mobile/) from the same web app in dist/, signs it with the studio's release key, and publishes
# it. Pushes to main publish the "android-test" pre-release. Running this workflow by hand on another branch (such as
# test) publishes the "android-preview" pre-release, for trying changes before they are merged. Official releases are
# made by running it by hand on main with "release" ticked; it creates the tag v<version from package.json> itself.
# (Pushing a tag does nothing: a tag can point at any commit, so it is not a trigger.)
#
# Three jobs, so the signing key and write access are each used in one place only:
#   build   - read-only; makes an UNSIGNED APK. npm and Gradle (and every package they run) never see the key,
#             its password or a token that can write to the repository.
#   sign    - read-only; runs no code from the repository. Signs that APK with apksigner, then checks it (no internet
#             permission, signed with the published key). The key is kept in the protected "signing" environment,
#             so every run waits here for the owner's approval.
#   publish - the only job that can write: creates the release or the pre-release.
on:
  push:
    branches: [main]
    paths: ['*.html', '*.js', '*.css', '*.png', '*.svg', 'manifest.webmanifest', 'fonts/**', '_headers', 'build.mjs', 'package.json', 'CHANGELOG.md', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the official release (tag v<version from package.json>) from this commit (main only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:   # a newer build replaces an older one; a release run is never cancelled, nor cancels anything
  group: android-apk-${{ github.ref }}-${{ inputs.release && 'release' || 'build' }}
  cancel-in-progress: ${{ !inputs.release }}
env:
  APK_NAME: Rounds
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false   # no token left in .git/config for later steps to find
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the web app
        run: node build.mjs
      - name: Copy it into the Android project
        working-directory: mobile
        run: npm ci && npx cap sync android
      - name: Build the APK (unsigned)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          set +e; ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; status=${PIPESTATUS[0]}; set -e
          if [ "$status" != 0 ]; then
            # show the reason as an annotation on the run page
            msg=$(grep -E -A4 "error:|What went wrong|Lint found" "$RUNNER_TEMP/gradle.log" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Android build failed::$msg"
            exit "$status"
          fi
      - name: Find it
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$APK" ]; then echo "::error::No unsigned release APK was built"; ls -R mobile/android/app/build/outputs/apk || true; exit 1; fi
          cp "$APK" unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: unsigned-apk
          path: unsigned.apk
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    # the keystore secrets live in the protected "signing" environment: every run waits here for the owner's approval
    environment: signing
    permissions:
      contents: read
    outputs:
      cert: ${{ steps.check.outputs.cert }}
    env:
      VER: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 · only for build.mjs (the published fingerprint); nothing from the repository runs here
        with:
          persist-credentials: false
          sparse-checkout: build.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7.0.0
        with:
          name: unsigned-apk
      - name: Sign with the studio's key
        env:
          KS: ${{ secrets.LEADONE_KEYSTORE_B64 }}           # the studio's shared signing key, used by every studio app
          KS_PASS: ${{ secrets.LEADONE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the repository secrets LEADONE_KEYSTORE_B64 and LEADONE_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          umask 077; echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/studio.jks"
          "$BT/zipalign" -c -p 4 unsigned.apk >/dev/null 2>&1 || { "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk && mv aligned.apk unsigned.apk; }
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/studio.jks" --ks-key-alias leadone --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$APK_NAME-$VER.apk" unsigned.apk
          rm -f "$RUNNER_TEMP/studio.jks"
      - name: Check the APK (no internet permission, signed with the published key)
        id: check
        run: |
          APK="$APK_NAME-$VER.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::INTERNET permission found"; exit 1; fi
          "$BT/apksigner" verify --min-sdk-version 24 "$APK"
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -i "certificate SHA-256 digest" | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Signing certificate SHA-256: $CERT"
          WANT=$(grep -o "certSha256: '[0-9A-F:]*'" build.mjs | sed "s/certSha256: '//; s/'//")
          if [ -z "$WANT" ] || [ "$CERT" != "$WANT" ]; then echo "::error::Signed with $CERT, but the published fingerprint is $WANT"; exit 1; fi
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ${{ env.APK_NAME }}-${{ env.VER }}-apk
          path: ${{ env.APK_NAME }}-${{ env.VER }}.apk

  publish:
    needs: [build, sign]
    # official release (by hand, main only), android-test (push to main) or android-preview (by hand on another branch)
    if: inputs.release || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that can change the repository (create the tag and release)
    env:
      VER: ${{ needs.build.outputs.version }}
      CERT: ${{ needs.sign.outputs.cert }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 · only for CHANGELOG.md (the release notes)
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7.0.0
        with:
          name: ${{ env.APK_NAME }}-${{ needs.build.outputs.version }}-apk
      - name: Publish the official release
        if: inputs.release
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::Official releases are made from main only"; exit 1; fi
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::Release $TAG already exists; raise the version first"; exit 1; fi
          F="$APK_NAME-$VER.apk"; SUM=$(sha256sum "$F" | cut -d' ' -f1); echo "$SUM  $F" > "$F.sha256"
          { awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md
            echo; echo "## Download and check"
            echo "- **$F** (below). Install guide: https://rounds.anonacondacodelab.com/android.html"
            echo "- SHA-256 of the APK: \`$SUM\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo; echo "Built by GitHub Actions from this tag's source code (also attached below). No internet permission."; } > notes.md
          gh release create "$TAG" "$F" "$F.sha256" --target "$GITHUB_SHA" --latest --title "Rounds $VER" --notes-file notes.md
      - name: Publish as the android-test pre-release
        if: ${{ !inputs.release && github.ref == 'refs/heads/main' }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test "$APK_NAME-$VER.apk" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Android test build $VER (build ${{ github.run_number }})" \
            --notes "Test build of the Android app, made automatically from commit ${GITHUB_SHA::7}. Install over the previous test build; your timers and settings are kept."
      - name: Publish as the android-preview pre-release (a branch built by hand, for testing before it is merged)
        if: ${{ !inputs.release && github.ref != 'refs/heads/main' }}
        run: |
          gh release delete android-preview --yes --cleanup-tag || true
          gh release create android-preview "$APK_NAME-$VER.apk" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Android preview $VER from ${GITHUB_REF_NAME} (build ${{ github.run_number }})" \
            --notes "Preview of unreleased changes from the ${GITHUB_REF_NAME} branch, commit ${GITHUB_SHA::7}. For testing only."
