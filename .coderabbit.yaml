# CodeRabbit settings for Rounds: reviews pull requests into main (adapted from Unmarked's review settings)
language: en-GB
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  # built output, fonts, images and Android tooling: not our code, or generated from it
  path_filters:
    - "!dist/**"
    - "!fonts/**"
    - "!mobile/package-lock.json"
    - "!mobile/android/gradle/**"
    - "!mobile/android/gradlew"
    - "!mobile/android/gradlew.bat"
    - "!mobile/android/app/src/main/res/mipmap-*/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.woff2"
  path_instructions:
    - path: "**"
      instructions: |
        Rounds is an interval timer that runs entirely on the device. By design it has no network access: the page's
        Content Security Policy has connect-src 'none' and style-src 'self' (no inline style attributes in markup;
        setting element.style from script is fine), and the Android app has no INTERNET permission. Only small
        settings and the user's own timers are stored, in localStorage. Focus on correctness of the timing and beeps,
        privacy (nothing may be sent anywhere), and untrusted input reaching the page unescaped.
    - path: "app.js"
      instructions: |
        Timer names, exercise names and imported timers files are untrusted: they must never reach innerHTML without
        escaping. Check the import of a timers file validates every field it takes, including the heart-rate zone
        settings. Heart-rate zones are optional and must not change the run screen when no strap is connected or
        zones are not set up.
    - path: "hr.js"
      instructions: |
        Heart-rate parsing from Bluetooth packets (untrusted) and zone maths: share of max heart rate, or of heart-rate
        reserve with a resting rate; max entered or estimated with Tanaka (208 - 0.7 x age). Check edge cases and
        that readings are never stored or sent.
    - path: "engine.js"
      instructions: |
        Builds the list of timer segments and beeps. Check durations, rounding and the 3-2-1 beep plan at segment
        boundaries.
    - path: "native.js"
      instructions: |
        Bridge to the Android app (Web Bluetooth subset, file saving, speech, vibration). Check error handling.
    - path: "mobile/**/*.java"
      instructions: |
        Android plugin and foreground service: check intent handling, what is exported, and that nothing needs or
        uses internet access.
    - path: ".github/workflows/**"
      instructions: |
        Release pipeline using the studio's signing key. Three jobs: build (read-only, unsigned APK, no secrets),
        sign (read-only, runs no repository code), publish (the only job with contents: write). Check secret
        handling, permissions and supply-chain risks.
